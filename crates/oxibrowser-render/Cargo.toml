[package]
name = "oxibrowser-render"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
description = "CSS-aware HTML rendering pipeline for OxiBrowser (Blitz-backed)"

[dependencies]
# Blitz rendering stack — isolated to this crate so the Stylo / html5ever 0.39
# / vello dependency trees do not leak into the rest of the workspace.
blitz-dom = { workspace = true }
blitz-html = { workspace = true }
blitz-paint = { workspace = true }
blitz-traits = { workspace = true }
# Match blitz-html's parser so the resource policy can delegate its TreeSink.
html5ever = "0.39"
xml5ever = "0.39"
anyrender = { workspace = true }
anyrender_vello_cpu = { workspace = true, features = ["multithreading"] }
peniko = { workspace = true }
parley = "0.10"
png = { workspace = true }
# Direct stylo access for damage constants blitz-dom keeps crate-private.
style = { version = "0.19.0", package = "stylo" }
style_traits = { version = "0.19.0", package = "stylo_traits" }
printpdf = { version = "0.12", features = ["png"] }
tracing = { workspace = true }
parking_lot = { workspace = true }
# ANGLE-backed WebGL backend. Off by default: linking requires the pinned
# ANGLE static libraries from scripts/setup-angle.sh (third_party/angle).
glow = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[features]
webgl = ["dep:glow", "dep:thiserror"]

[lib]
path = "src/lib.rs"
