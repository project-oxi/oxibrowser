name: Release macOS

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and attach (e.g. v0.25.0)'
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BIN: oxibrowser
  # Secrets cannot appear in step `if:` conditions directly; this env
  # passthrough routes between the signed and unsigned paths.
  APPLE_CERT_PRESENT: ${{ secrets.APPLE_CERTIFICATE != '' }}

jobs:
  macos:
    name: Build, sign (when credentials exist), publish macOS binary
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@1.96
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          brew install python-setuptools 2>/dev/null || true
          # fontconfig/freetype/expat come from the system/homebrew for Blitz

      - name: Build (aarch64 + x86_64, release)
        run: |
          cargo build --release --features browser --target aarch64-apple-darwin
          cargo build --release --features browser --target x86_64-apple-darwin

      - name: Lipo universal binary
        run: |
          mkdir -p dist
          lipo -create \
            target/aarch64-apple-darwin/release/$BIN \
            target/x86_64-apple-darwin/release/$BIN \
            -output dist/$BIN
          file dist/$BIN

      - name: Import Developer ID certificate into a temporary keychain
        if: env.APPLE_CERT_PRESENT == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          # Never echo the certificate or password. The keychain lives in the
          # runner's temp dir and is deleted with the job.
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          # One keychain password for create/unlock/partition-list.
          KC_PASS="$(uuidgen)"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KEYCHAIN_PATH" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          IMPORTED=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | awk -F'"' '/Developer ID Application/{print $2; exit}')
          if [ -z "$IMPORTED" ]; then
            echo "no codesigning identity found after import" >&2
            exit 1
          fi
          if [ "$IMPORTED" != "$APPLE_SIGNING_IDENTITY" ]; then
            echo "imported identity ($IMPORTED) != APPLE_SIGNING_IDENTITY" >&2
            exit 1
          fi
          rm -f "$CERT_PATH"

      - name: Sign (hardened runtime, secure timestamp)
        if: env.APPLE_CERT_PRESENT == 'true'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          codesign --force --options runtime --timestamp \
            --sign "$APPLE_SIGNING_IDENTITY" dist/$BIN
          codesign --verify --strict --verbose=2 dist/$BIN
          codesign -dvv dist/$BIN 2>&1 | grep -E 'Identifier|Authority=Developer ID Application|TeamIdentifier' || true

      - name: Ad-hoc signature (no Apple credentials, or notarization failed)
        if: env.APPLE_CERT_PRESENT != 'true' || steps.notarize.outcome != 'success'
        run: |
          set -euo pipefail
          # Ship unsigned: stamp an ad-hoc signature so the binary carries a
          # stable local identity and passes strict verification, and mark
          # the artifacts -unsigned. This also REPLACES a Developer ID
          # signature when notarization is unavailable — a Developer-ID-
          # signed but un-notarized binary hard-blocks Gatekeeper, while
          # ad-hoc merely prompts (right-click → Open, or
          # xattr -d com.apple.quarantine). `cargo install` is unaffected.
          codesign --force --sign - dist/$BIN
          codesign --verify --strict --verbose=2 dist/$BIN
          echo "SHIP_UNSIGNED=1" >> "$GITHUB_ENV"

      - name: Zip
        run: |
          ditto -c -k --keepParent dist/$BIN dist/$BIN.zip

      - name: Notarize (notarytool)
        id: notarize
        if: env.APPLE_CERT_PRESENT == 'true'
        # The Developer ID certificate secret can outlive the Apple account
        # (expired membership/agreements → notarytool 403). A failed
        # notarization downgrades the run to the unsigned path below
        # instead of failing the release.
        continue-on-error: true
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # The notarized ZIP is the primary artifact. `stapler` cannot attach
          # a ticket to a bare Mach-O (Error 73 — bundle/dmg formats only),
          # so offline validation comes from the notarized ZIP; online
          # Gatekeeper validation is checked below via spctl.
          xcrun notarytool submit dist/$BIN.zip \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

      - name: Verify the binary inside the notarized zip
        if: env.APPLE_CERT_PRESENT == 'true' && steps.notarize.outcome == 'success'
        run: |
          set -euo pipefail
          # macOS 15 runners: `spctl -a` cannot assess a bare Mach-O without
          # a bundle ("invalid API object reference"). For zip-distributed
          # CLI tools the Gatekeeper contract is: strict signature validity
          # + an Accepted notarization submission keyed by this code
          # signature (validated online at first launch on user machines).
          CHECK_DIR="$RUNNER_TEMP/gk-check"
          rm -rf "$CHECK_DIR" && mkdir -p "$CHECK_DIR"
          # --keepParent stores "dist/oxibrowser"; locate the binary robustly.
          ditto -x -k dist/$BIN.zip "$CHECK_DIR"
          BIN_PATH=$(find "$CHECK_DIR" -type f -name $BIN | head -1)
          [ -n "$BIN_PATH" ] || { echo "binary not found in the zip" >&2; exit 1; }
          codesign --verify --strict --verbose=2 "$BIN_PATH"
          codesign -dv --entitlements - "$BIN_PATH" 2>&1 | \
            grep -E 'Identifier=|TeamIdentifier=' || true

      - name: Stage artifacts + checksums
        working-directory: dist
        run: |
          set -euo pipefail
          if [ "$APPLE_CERT_PRESENT" = "true" ] && [ -z "${SHIP_UNSIGNED:-}" ]; then
            OUT="$BIN"
          else
            OUT="$BIN-unsigned"
            mv "$BIN" "$OUT"
            rm -f "$BIN.zip"
            ditto -c -k --keepParent "$OUT" "$OUT.zip"
          fi
          shasum -a 256 "$OUT" > "$OUT.sha256"
          shasum -a 256 "$OUT.zip" > "$OUT.zip.sha256"
          cat "$OUT.sha256" "$OUT.zip.sha256"
          echo "STAGED_OUT=$OUT" >> "$GITHUB_ENV"

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oxibrowser-macos
          path: |
            dist/${{ env.STAGED_OUT }}
            dist/${{ env.STAGED_OUT }}.zip
            dist/${{ env.STAGED_OUT }}.sha256
            dist/${{ env.STAGED_OUT }}.zip.sha256

      - name: Attach to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [ "$APPLE_CERT_PRESENT" = "true" ] && [ -z "${SHIP_UNSIGNED:-}" ]; then
            NOTES="macOS Developer ID signed + notarized build"
          else
            NOTES="macOS universal build — UNSIGNED (ad-hoc signature; no Apple Developer credentials).
          Gatekeeper will prompt on first launch: right-click → Open, or remove the quarantine bit:
          xattr -d com.apple.quarantine oxibrowser-unsigned && chmod +x oxibrowser-unsigned
          The signed/notarized path returns once Developer ID credentials are configured again.
          \`cargo install oxibrowser\` installs without any of this."
          fi
          # The Publish workflow (crates.io + release notes) may still be
          # running — create the release if it does not exist yet, then
          # upload with --clobber for idempotent retries.
          for i in 1 2 3 4 5 6; do
            if gh release view "$TAG" > /dev/null 2>&1; then break; fi
            echo "release $TAG not visible yet ($i/6) — waiting"
            sleep 30
          done
          gh release view "$TAG" > /dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --verify-tag --notes "$NOTES"
          gh release upload "$TAG" \
            "dist/$STAGED_OUT" "dist/$STAGED_OUT.zip" \
            "dist/$STAGED_OUT.sha256" "dist/$STAGED_OUT.zip.sha256" \
            --clobber
