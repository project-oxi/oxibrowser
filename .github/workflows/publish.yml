name: Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.20.0)'
        required: true
        default: ''

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev \
            libfreetype-dev \
            libexpat1-dev

      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2

      # Publish leaf-first: render → core → cdp → oxibrowser.
      # Each crate depends on the previous one via crates.io (path deps are
      # resolved to registry versions at publish time), so we wait for index
      # propagation between steps.
      - name: Publish oxibrowser-render
        run: cargo publish -p oxibrowser-render
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for index propagation
        run: sleep 30

      - name: Publish oxibrowser-core
        run: cargo publish -p oxibrowser-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for index propagation
        run: sleep 30

      - name: Publish oxibrowser-cdp
        run: cargo publish -p oxibrowser-cdp
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Wait for index propagation
        run: sleep 30

      - name: Publish oxibrowser
        run: cargo publish -p oxibrowser
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [publish]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Create GitHub release from CHANGELOG
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VER="${TAG#v}"
          {
            awk "/^## \\[$VER\\]/{f=1; next} /^## \\[/{f=0} f" CHANGELOG.md
            printf '\n**Full changelog**: https://github.com/project-oxi/oxibrowser/blob/main/CHANGELOG.md\n'
          } > release-notes.md
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md --verify-tag
