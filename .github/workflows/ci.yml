name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# System packages required by native-build deps in the Blitz / vello_cpu /
# parley / fontconfig stack. ubuntu-latest runners are minimal; install
# these before any cargo invocation that exercises the browser build.
jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev \
            libfreetype-dev \
            libexpat1-dev
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --features oxibrowser/browser

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev \
            libfreetype-dev \
            libexpat1-dev
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --features oxibrowser/browser
      # Integration tests require external network and are #[ignore]d by default.
      # Run manually via `cargo test -p oxibrowser --test integration -- --ignored`.

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev \
            libfreetype-dev \
            libexpat1-dev
      - uses: dtolnay/rust-toolchain@1.96
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --features oxibrowser/browser -- -D warnings

  spa:
    name: SPA acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libfreetype-dev libexpat1-dev
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/spa/package-lock.json
      - run: npm ci --prefix tests/spa
      - name: Install pinned reference browser
        working-directory: tests/spa
        run: npx playwright install --with-deps chromium
      - run: cargo build --release --features browser --bin oxibrowser
      - name: Compare local SPA tasks in fresh browser processes
        run: |
          SPA_REFERENCE_CHROME="$(node -e 'console.log(require("./tests/spa/node_modules/playwright").chromium.executablePath())')"
          python3 tests/spa/run_processes.py --binary target/release/oxibrowser --chrome "$SPA_REFERENCE_CHROME" --runs 10 --out tests/spa/results/ci
      - name: Repeated navigation and isolated contexts
        run: node tests/spa/stability.mjs --binary target/release/oxibrowser --cycles 100 --out tests/spa/results/ci/stability
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spa-acceptance-evidence
          path: tests/spa/results/ci

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.96
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command-arguments: advisories licenses bans sources
      # deny.toml is the single source of truth for known-accepted advisories.

  build-release:
    name: Release Build
    runs-on: ubuntu-latest
    needs: [check, test, clippy, spa, fmt, audit]
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev \
            libfreetype-dev \
            libexpat1-dev
      - uses: dtolnay/rust-toolchain@1.96
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --features browser --bin oxibrowser
      - uses: actions/upload-artifact@v4
        with:
          name: oxibrowser-linux-amd64
          path: target/release/oxibrowser
