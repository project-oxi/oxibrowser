<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>react-spa</title>
  <link rel="icon" href="data:,">
</head>
<body>
  <div id="root"></div>
  <script src="/vendor/react.js"></script>
  <script src="/vendor/react-dom.js"></script>
  <script>
    (function () {
      'use strict';
      var e = React.createElement;
      function App() {
        var countState = React.useState(0), count = countState[0], setCount = countState[1];
        var textState = React.useState(''), text = textState[0], setText = textState[1];
        var draftState = React.useState(''), draft = draftState[0], setDraft = draftState[1];
        var itemsState = React.useState([]), items = itemsState[0], setItems = itemsState[1];
        var showState = React.useState(false), show = showState[0], setShow = showState[1];
        function add() {
          if (!draft) return;
          setItems(items.concat([draft]));
          setDraft('');
        }
        return e('div', null,
          e('h1', null, 'React'),
          e('button', { id: 'inc', onClick: function () { setCount(count + 1); } }, 'Increment'),
          e('div', { id: 'count' }, 'count=', count),
          e('input', { id: 'ctl', value: text, onChange: function (ev) { setText(ev.target.value); } }),
          e('div', { id: 'mirror' }, text),
          e('input', { id: 'item', value: draft, onChange: function (ev) { setDraft(ev.target.value); } }),
          e('button', { id: 'add', onClick: add }, 'Add'),
          e('ul', { id: 'list' }, items.map(function (it, i) {
            return e('li', { key: it + '#' + i, className: 'li' }, it);
          })),
          e('button', { id: 'toggle', onClick: function () { setShow(!show); } }, 'Toggle'),
          show ? e('div', { id: 'cond' }, 'visible') : null
        );
      }
      ReactDOM.createRoot(document.getElementById('root')).render(e(App));
    })();
  </script>
</body>
</html>
