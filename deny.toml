[advisories]
# cargo-deny 0.20+: vulnerability/unmaintained/yanked/unsound are all
# denied by default; only `ignore` remains.
#
# RUSTSEC-2024-0436 (paste): unmaintained proc-macro dep, transitively
# pulled in by boa_engine via boa_string. Upstream boa must switch off
# `paste` before this can be removed; no actionable fix on our side.
# RUSTSEC-2025-0141 (bincode): unmaintained, transitively pulled in by
# printpdf → azul-layout → hyphenation. No safe upgrade available per the
# advisory itself; out of our control until printpdf updates.
# RUSTSEC-2024-0449 (unsafe-libyaml): serde_yaml 0.9's backend. serde_yaml
# is deprecated upstream and used only by `run` script parsing
# (core/src/script/parser.rs); no adopted successor exists yet — revisit
# when one clears community review.
# RUSTSEC-2026-0370/0371/0372 (zvariant, zbus_names, zvariant_derive):
# folded into the zbus monorepo; reachable only through keyring 4.2.0
# (latest) → secret-service → zbus 4 on non-macOS keychain paths. Unblock
# when keyring ships a zbus 5-based release.
ignore = [
    "RUSTSEC-2024-0436",
    "RUSTSEC-2026-0192",
    "RUSTSEC-2026-0206",
    "RUSTSEC-2025-0141",
    "RUSTSEC-2024-0449",
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
    # RUSTSEC-2026-0385/0382 (webpki-roots): re-export compatibility shim
    # for webpki-roots 1.x; reqwest 0.12 pins the 0.x shim. Unblock when
    # reqwest upgrades to webpki-roots 1.x.
    "RUSTSEC-2026-0385",
    "RUSTSEC-2026-0382",
    # RUSTSEC-2026-0386/0383/0381: transitively pulled in by the wreq 6.0.0-rc
    # TLS fingerprint stack (browser impersonation headers + cert store).
    # No safe upgrade available until wreq ships a stable release.
    "RUSTSEC-2026-0386",
    "RUSTSEC-2026-0383",
    "RUSTSEC-2026-0381",
]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-DFS-2016", "Unicode-3.0", "Zlib", "BSL-1.0", "OpenSSL", "NCSA", "CDLA-Permissive-2.0", "MPL-2.0", "CC0-1.0"]

confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]