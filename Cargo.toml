[workspace]
resolver = "2"
members = [
    "crates/oxibrowser",
    "crates/oxibrowser-cdp",
    "crates/oxibrowser-core",
    "crates/oxibrowser-render",
    "crates/oxibrowser-webapi",
]

[workspace.package]
version = "0.16.0"
edition = "2024"
license = "MIT"
authors = ["project-oxi contributors"]
repository = "https://github.com/project-oxi/oxibrowser"
homepage = "https://github.com/project-oxi/oxibrowser"
readme = "README.md"
keywords = ["browser", "headless", "cdp", "automation", "dom"]
categories = ["web-programming", "parser-implementations"]
rust-version = "1.96"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = { version = "0.1", features = ["attributes"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
wreq = { version = "=6.0.0-rc.29", features = ["json", "form"] }
wreq-util = "3.0.0-rc"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tokio-tungstenite = "0.26"
image = "0.25"
url = "2"
html5ever = "0.29"
markup5ever = "0.14"
string_cache = "0.8"
log = "0.4"
encoding_rs = "0.8"
bytes = "1"
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
sha1 = "0.10"
base64 = "0.22"
boa_engine = "0.20"
boa_gc = "0.20"
getrandom = "0.3"

# Rendering stack (Blitz integration) — isolated to oxibrowser-render so the
# Stylo / html5ever 0.39 / vello dependency trees stay out of the rest of the workspace.
blitz-dom = "0.3.0-beta.1"
blitz-html = "0.3.0-beta.1"
blitz-paint = "0.3.0-beta.1"
blitz-traits = "0.3.0-beta.1"
anyrender = "0.11"
anyrender_vello_cpu = "0.14"
peniko = "0.6"
png = "0.18"

[workspace.metadata.release]
version = "0.14.1"