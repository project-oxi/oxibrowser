[workspace]
resolver = "2"
members = [
    "crates/oxibrowser",
    "crates/oxibrowser-cdp",
    "crates/oxibrowser-core",
    "crates/oxibrowser-render",
    "crates/oxibrowser-webapi",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "MIT"
authors = ["Oxios Team"]
repository = "https://github.com/a7garden/oxibrowser"
homepage = "https://github.com/a7garden/oxibrowser"
readme = "README.md"
keywords = ["browser", "headless", "cdp", "automation", "dom"]
categories = ["web-programming", "parser-implementations"]
rust-version = "1.82"

[workspace.dependencies]
# Async
tokio = { version = "1", features = ["full"] }
futures = "0.3"
async-trait = "0.1"

# JavaScript engine
boa_engine = "0.20"
boa_gc = "0.20"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# HTTP
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# WebSocket
tokio-tungstenite = "0.26"

# Image
image = "0.25"

# URL
url = "2"

# DOM / HTML parsing (from servo ecosystem)
html5ever = "0.29"
markup5ever = "0.14"
string_cache = "0.8"

# Logging / tracing
log = "0.4"

# Encoding
encoding_rs = "0.8"

# Utilities
bytes = "1"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
sha1 = "0.10"
base64 = "0.22"

# Internal crates
oxibrowser-core = { version = "0.2.0", path = "crates/oxibrowser-core" }
oxibrowser-cdp = { version = "0.2.0", path = "crates/oxibrowser-cdp" }
oxibrowser-webapi = { version = "0.2.0", path = "crates/oxibrowser-webapi" }
oxibrowser-render = { version = "0.2.0", path = "crates/oxibrowser-render" }

# Binary size optimization for release builds
[profile.release]
opt-level = "z"       # Size optimization over speed
lto = true            # Link-time optimization for smaller binaries
codegen-units = 1     # Better optimization (slower compile)
strip = true          # Strip debug symbols
panic = "abort"       # Smaller unwinding tables

# JS engine needs speed, not size
[profile.release.package.boa_engine]
opt-level = 3

